[theme]
base = "light"
primaryColor = "#347FD1"
backgroundColor = "#F9F9F7"
secondaryBackgroundColor = "#F3F3F0"
textColor = "#0B0B0B"
linkColor = "#2468B4"
linkUnderline = false
borderColor = "#E3E2DE"
dataframeBorderColor = "#E3E2DE"
dataframeHeaderBackgroundColor = "#F3F3F0"
showWidgetBorder = true
baseRadius = "0.875rem"
buttonRadius = "0.625rem"
font = "sans-serif"
headingFont = "sans-serif"
baseFontSize = 15
headingFontSizes = ["2rem", "1.55rem", "1.25rem", "1.05rem", "0.95rem", "0.85rem"]
headingFontWeights = [700, 650, 650, 650, 600, 600]
blueColor = "#347FD1"
greenColor = "#24B68A"
orangeColor = "#F16634"
yellowColor = "#E6A007"
violetColor = "#7161B5"
redColor = "#D84F55"
grayColor = "#72736F"
chartCategoricalColors = ["#347FD1", "#F16634", "#24B68A", "#E6A007", "#7161B5", "#DF6A9E", "#72736F"]

[theme.sidebar]
primaryColor = "#24B68A"
backgroundColor = "#0F1830"
secondaryBackgroundColor = "#2A344D"
textColor = "#F8FBFF"
borderColor = "#0F1830"
linkColor = "#FFFFFF"

[client]
toolbarMode = "viewer"

[server]
headless = true
runOnSave = true
